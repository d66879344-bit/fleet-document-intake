<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Document Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="wrap">
  <header class="head">
    <span class="eyebrow">Document intake</span>
    <h1>Fleet Document Intake</h1>
    <p class="lede">Upload driver, vehicle and company documents. PDF, JPG, PNG, WebP or GIF, up to 20&nbsp;MB per file.</p>
  </header>

  <div class="country-bar" id="countryBar" hidden>
    <span>Country: <b id="countryLabel"></b></span>
    <button type="button" class="linkbtn" id="changeCountry">Change</button>
  </div>

  <section class="card" id="formCard" hidden>
    <div class="tabs" id="groupTabs" role="tablist" aria-label="Document group"></div>

    <form id="intakeForm" novalidate>
      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" autocomplete="off" required>
      </div>
      <div class="field" id="refField">
        <label for="ref" id="refLabel">Reference</label>
        <input type="text" id="ref" autocomplete="off">
      </div>
      <div class="field" id="otherDescField" hidden>
        <label for="otherDesc">What is this document?</label>
        <input type="text" id="otherDesc" autocomplete="off" placeholder="e.g. general liability policy, additional permit">
      </div>

      <div class="slots" id="slots"></div>

      <div class="field">
        <label for="contact">Contact (phone or email) <span class="hint">optional</span></label>
        <input type="text" id="contact" autocomplete="off">
      </div>
      <div class="field">
        <label for="notes">Note <span class="hint">optional</span></label>
        <textarea id="notes" rows="2"></textarea>
      </div>

      <button type="submit" class="btn" id="submitBtn">Upload documents</button>
      <p class="progress" id="progress"></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>

<div class="modal-backdrop" id="countryModal">
  <div class="modal">
    <h2>Select country</h2>
    <p>This decides which documents we ask for.</p>
    <div class="country-grid" id="countryGrid"></div>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
